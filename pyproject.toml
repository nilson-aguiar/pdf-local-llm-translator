[project]
name = "pdf-translator"
version = "0.1.0"
description = "Fully offline, privacy-first CLI that translates PDFs end-to-end using a local LLM."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nilson Aguiar", email = "5804096+nilson-aguiar@users.noreply.github.com" }
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "weasyprint>=62",
    "linkify-it-py>=2.2.0",
]

[project.scripts]
pdf-translate = "pdf_translator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_translator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
